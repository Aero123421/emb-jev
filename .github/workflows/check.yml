name: Check
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,experiment]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m build
